spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wit_db?serverTimezone=Asia/Seoul
    username: root
    password: 'password'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: "your-secret-key-minimum-32-characters"
  expiration: 86400000

ai:
  comfyui:
    base-url: ${COMFYUI_BASE_URL:http://localhost:8188}
    connect-timeout-seconds: 5
    read-timeout-seconds: 300
    poll-interval-millis: 2000
    max-poll-attempts: 150
  storage:
    local-path: ${AI_IMAGE_STORAGE_PATH:./generated-images}