name: Backend CI

on:
  push:
    branches: [ "test/github-actions" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./backend # backend 폴더가 따로 있다면 유지, 아니면 삭제

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: ./backend # backend 폴더가 따로 있다면 유지, 아니면 삭제