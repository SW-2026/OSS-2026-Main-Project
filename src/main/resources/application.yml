spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wit_db?serverTimezone=Asia/Seoul
    username: root
    password: 'your password'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: "your-secret-key-minimum-32-characters"
  expiration: 86400000